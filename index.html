<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>헬과장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">
/* Layout: 쇼핑몰처럼 익숙한 화면 — 상단 검색바, 상품 카드 그리드, 정렬 탭, 별점·리뷰 수, 왼쪽 필터. */
:root{
  --bg:#0D0B0A; --panel:#181513; --ink:#F2EFEC; --muted:#A49D96; --line:#2E2925; --rule:#40392F;
  --accent:#D6A85C; --accent-ink:#1A140E; --accent-soft:#2A2116;
  --price:#F2C47A; --star:#FFB23F; --thumb:#221E1B;
  --good:#5FD08A; --good-soft:#13291C; --warn:#F2AA4C; --warn-soft:#2E220F;
  --f-body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
  --cta1:#A57A36; --cta2:#D9AD62; --cta-ink:#1A140E; --cta-btn:#1A140E; --cta-btn-ink:#F2D29A; --glow:214 168 92; --tab-sel:#251D13; --badge:#D6A85C; --badge-ink:#1A140E;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:radial-gradient(1200px 520px at 50% 0,#2A221D 0,rgb(42 34 29 / 0) 70%) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.in{max-width:1200px;margin:0 auto;padding-inline:16px}
.wrap{padding-bottom:64px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 상단 바 */
header.top{background:linear-gradient(180deg,#161210,#110E0C);border-bottom:1px solid var(--line)}
.hero{margin:0;height:clamp(110px,14vw,190px);background:#120F0D url(banner.jpg) center/cover no-repeat;border-bottom:1px solid var(--line);box-shadow:inset 0 -24px 30px -20px rgb(0 0 0 / .8)}
.hero span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.util{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.util .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;padding-block:6px}
.stamp{display:flex;flex-wrap:wrap;gap:2px 14px}
.stamp span+span::before{content:"";display:inline-block;width:1px;height:10px;background:var(--line);margin-right:14px;vertical-align:-1px}
.gnb{display:flex;align-items:center;gap:14px 28px;padding-block:18px 14px;flex-wrap:wrap}
.sbar{flex:1 1 380px;min-width:0;display:flex;border:2px solid var(--accent);border-radius:4px;background:var(--panel);height:46px}
.search{flex:1;min-width:0;border:0;background:none;padding:0 14px;font-size:15px}
.search:focus{outline:none}
.sbtn{flex:none;width:52px;border:0;background:none;cursor:pointer;color:var(--accent);display:grid;place-items:center}
.sbtn svg{width:24px;height:24px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-top:2px}
.tab{background:var(--panel);border:1.5px solid var(--rule);border-bottom:0;border-radius:8px 8px 0 0;padding:11px 18px 10px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap;box-shadow:inset 0 -3px 0 transparent}
.tab:hover{color:var(--ink);border-color:#5A5048}
.tab[aria-selected="true"]{color:var(--ink);background:var(--tab-sel);border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tab .n-all{font-weight:700}
.intro{padding-block:14px 0;color:var(--muted);font-size:13px}
.intro p{margin:0;text-wrap:pretty}
.intro .disc{margin-top:2px;font-size:12px}
section[role=tabpanel]{padding-top:14px}

/* 공통 상자 */
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px}

/* 맞춤 추천 */
.rec{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tab-badge{display:inline-block;margin-left:4px;font-size:11px;font-weight:700;color:var(--badge-ink);background:var(--badge);border-radius:3px;padding:0 5px;vertical-align:2px}
.askbar{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:16px;padding:16px 18px;background:linear-gradient(100deg,var(--cta1),var(--cta2) 60%,var(--cta1));color:var(--cta-ink);border:0;border-radius:10px;text-align:left;cursor:pointer;font-size:15px;box-shadow:0 6px 22px rgb(var(--glow) / .35);transition:transform .12s,box-shadow .12s}
.askbar:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgb(var(--glow) / .5)}
.askbar b{color:var(--cta-ink);font-size:17px;display:block}
.askbar .ava{background:var(--cta-btn);color:var(--cta-btn-ink);width:42px;height:42px;font-size:17px}
.askgo{margin-left:auto;flex:none;font-weight:800;font-size:15px;color:var(--cta-btn-ink);background:var(--cta-btn);border-radius:999px;padding:10px 18px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.askgo{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(4px)}90%{transform:none}}}
@media (max-width:640px){.askbar{flex-wrap:wrap}.askbar .ava{display:none}.askgo{margin-left:0;width:100%;text-align:center}}
.ava{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.chat{padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg .bub{background:var(--bg);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14.5px;line-height:1.55;max-width:min(560px,100%);text-wrap:pretty}
.msg .bub .cov{margin-top:4px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px 4px 14px 14px;cursor:pointer;font-weight:600;text-align:left}
.msg.me .bub::after{content:" ✎";opacity:.7;font-weight:400}
.chips.ans{margin-left:42px;animation:rise .25s ease both}
.chips.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.chips.ans .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;min-height:60px;box-shadow:0 1px 2px rgb(0 0 0 / .05);transition:transform .1s}
.chips.ans .opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.chips.ans .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.chips.ans .oi{font-size:24px;line-height:1;flex:none}
.chips.ans .ot small{display:block;margin-top:2px;font-weight:500;font-size:12px;color:var(--muted)}
.chips.ans .nextq{grid-column:1/-1;border-radius:10px;min-height:52px;font-size:16px}
.hint{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--accent)}
@media (max-width:640px){.chips.ans{grid-template-columns:repeat(2,minmax(0,1fr))}.chips.ans .opt{padding:10px;gap:8px;font-size:14px}}
.chat .algnote{margin-left:42px}
.wdet{margin-left:42px;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.wdet summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--accent)}
.wdet .q{padding:8px 0 0;border:0}
.wdet .q h3{display:none}
.chat-acts{margin-left:42px;display:flex;gap:16px;align-items:center}
@media (max-width:640px){.chips.ans,.wdet,.chat-acts,.chat .algnote{margin-left:0}.chat{padding:12px}}
.quiz{display:flex;flex-direction:column;gap:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:4px 16px 12px;max-height:calc(100dvh - 24px);overflow:auto}
@media (max-width:880px){.quiz{position:static;max-height:none;overflow:visible}}
.quiz-t{margin:0;padding:12px 0;font-size:16px;font-weight:800;border-bottom:2px solid var(--ink)}
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.q h3{margin:0;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:baseline}
.q h3 .step{color:var(--accent);font-size:12px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:6px 11px;font-size:13.5px;cursor:pointer;line-height:1.3;text-align:left;min-height:40px}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"] small{color:var(--accent);opacity:.85;font-weight:500}
.jump{display:none;font-size:13px;font-weight:700;color:var(--accent);padding:10px 0}
@media (max-width:880px){.jump{display:inline}}
@media (prefers-reduced-motion:no-preference){@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
.wpanel{border-bottom:0}
.wnote{margin:0;font-size:12px;color:var(--muted)}
.wrows{display:flex;flex-direction:column;gap:4px}
.wrow{display:grid;grid-template-columns:76px minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:13px}
.wrow input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:24px}
.wrow b{text-align:right;font-size:12.5px}
.reset{align-self:flex-start;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px 0;font-size:13px}

.res-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:10px}
.res-head h2{margin:0;font-size:20px;font-weight:800;text-wrap:balance}
.res-head p{margin:0;color:var(--muted);font-size:13px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1080px){.podium{grid-template-columns:minmax(0,1fr)}}

/* 상품 썸네일 (사진 대신 맛 색 · 주원료 표시) */
.thumb{position:relative;display:block;aspect-ratio:1/1;background:var(--thumb);border-radius:4px;overflow:hidden}
.thumb svg{position:absolute;inset:14% 22% 8%;width:56%;height:78%}
.thumb.photo{background:#fff}
.thumb img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain}
.thumb.photo:not(.noimg) svg,.thumb.photo:not(.noimg) .th-lab{display:none}
.th-lab{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-size:12px;font-weight:800;color:#222;background:#fff;padding:1px 6px;border-radius:2px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.th-rk{position:absolute;left:0;top:0;min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;border-bottom-right-radius:4px}
.th-cat{position:absolute;right:6px;top:6px;font-size:11px;font-weight:700;background:rgb(0 0 0 / .6);color:#fff;padding:1px 6px;border-radius:2px}

/* 가격 · 별점 */
.price{display:block;font-size:18px;font-weight:800;color:var(--price);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price small{font-size:13px;font-weight:700}
.unit .nw{white-space:nowrap}
.price .sv{display:inline-block;font-size:12px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0;white-space:nowrap}
.unit{display:block;font-size:12px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.stars{position:relative;display:inline-block;color:var(--line);font-size:13px;letter-spacing:1px;line-height:1}
.stars::before{content:"★★★★★";position:absolute;left:0;top:0;width:var(--r);overflow:hidden;color:var(--star);white-space:nowrap}

/* 추천 카드 */
@media (max-width:640px){.label .facts .row.mx{display:none}}
.mxnote{display:none;margin:-4px 0 0;font-size:11.5px;color:var(--muted)}
@media (max-width:640px){.mxnote{display:block}}
.label{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.label:first-child{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.label .hd{display:flex;flex-direction:column;gap:8px}
.label .thumb{aspect-ratio:16/10}
.label .thumb svg{inset:10% 34% 6%;width:32%;height:84%}
.label .th-lab{top:58%;max-width:30%}
.label .th-rk{height:30px;min-width:auto;padding:0 10px;font-size:13px}
@media (max-width:1080px){.label .hd{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:start}.label .thumb{aspect-ratio:1/1}.label .thumb svg{inset:14% 22% 8%;width:56%;height:78%}.label .th-lab{top:60%;max-width:46%}}
@media (max-width:640px){.label .hd{grid-template-columns:112px minmax(0,1fr);gap:12px}.label .th-rk{height:24px;padding:0 6px;font-size:11.5px}.label .th-lab{font-size:11px}.label .price{font-size:19px}}
.label .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.label .nm{font-weight:600;font-size:15px;line-height:1.4;margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.label .mk{font-size:12px;color:var(--muted)}
.label .price{font-size:21px;margin-top:2px}
.fit{display:inline-flex;align-items:baseline;gap:4px;align-self:flex-start;margin-top:4px;background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:2px 8px;font-size:12px;font-weight:700}
.fit b{font-size:15px}
.facts{border-top:1px solid var(--line)}
.facts .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.facts .row>span:first-child{flex:none;white-space:nowrap;color:var(--muted)}
.facts .row b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.facts .row .rk{font-size:11px;color:var(--muted);margin-left:6px;font-weight:500}
.why,.care{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.why li::before{content:"✓";color:var(--accent);font-weight:800;margin-right:6px}
.care li{color:var(--warn)}
.care li::before{content:"!";font-weight:800;margin-right:8px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:1px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;line-height:1.5;font-weight:500}
.tag.good{border-color:var(--good);color:var(--good)}
.tag.muted{border-style:dashed}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.note{border-color:var(--warn);color:var(--warn)}
.lblchk{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:6px 12px;font-size:13.5px;line-height:1.55}
.lblchk dt{color:var(--muted);font-weight:600}
.lblchk dd{margin:0;text-wrap:pretty}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:2px}
.acts .btn.pri{flex:1 1 100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:4px;padding:9px 12px;font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--rule);background:var(--panel);min-height:40px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn:hover{filter:brightness(1.05)}
.acts .btn:not(.pri){flex:1}

.algnote{margin:2px 0 0;font-size:12.5px;line-height:1.55;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:8px 10px;text-wrap:pretty}
.rk.na,h4 .rk,.facts .row .rk.na{font-weight:500}
.cov{margin:0;font-size:11.5px;color:var(--muted)}
.facts .row b.txt{font-weight:600;text-align:right;white-space:normal}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer span{display:block;margin-bottom:4px}

/* 상품 그리드 (전체 비교 · 다음 후보) */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:10px}
.irow{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.irow:hover{box-shadow:0 4px 14px rgb(0 0 0 / .08);border-color:var(--rule)}
.item{display:flex;flex-direction:column;gap:4px;padding:10px 10px 6px;cursor:pointer;background:none;border:0;text-align:left;width:100%;flex:1;min-width:0}
.item .thumb{margin-bottom:6px;aspect-ratio:5/4}
.item .thumb svg{inset:12% 27% 6%;width:46%;height:82%}
.item .t{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.item .spec{font-size:12px;color:var(--ink)}
.item .spec i{font-style:normal;color:var(--muted)}
.item .tags{margin-top:2px}
.item .why1{display:block;margin-top:2px;font-size:12px;color:var(--muted);line-height:1.45}
.cmp-tg{margin:0 10px 10px;border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:5px 0;font-size:12.5px;cursor:pointer;min-height:34px;color:var(--muted)}
.cmp-tg[aria-pressed="true"],.btn.cmp-b[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.cmp-b{font-weight:500}
@media (max-width:640px){
  .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .item{padding:8px 8px 4px}
  .cmp-tg{margin:0 8px 8px}
  .price{font-size:16px}
}
.empty{grid-column:1/-1;border:1px dashed var(--rule);border-radius:6px;background:var(--panel);padding:28px;text-align:center;color:var(--muted)}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgb(0 0 0 / .1);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray-in{max-width:1168px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tray-k{font-weight:800;font-size:14px;flex:none}
.tray-items{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 300px;min-width:0}
.tray-it{display:inline-flex;align-items:center;gap:4px;max-width:100%;background:var(--accent-soft);border-radius:4px;padding:3px 4px 3px 10px;font-size:12.5px}
.tray-it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.tray-x{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;width:22px;height:22px;border-radius:50%}
.tray-acts{display:flex;gap:6px;flex:none}
.tray-acts .btn.pri{flex:none}
.tray-acts .btn:disabled{opacity:.55;cursor:default}
.tray-msg{max-width:1168px;margin:4px auto 0;font-size:12px;color:var(--warn)}
.tray-msg:empty{display:none}
body.has-tray .wrap{padding-bottom:140px}
.fab{display:none}
@media (max-width:880px){.fab:not([hidden]){display:flex;position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:19;justify-content:center;align-items:center;gap:6px;min-height:48px;background:var(--accent);color:var(--accent-ink);border-radius:6px;font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 6px 18px rgb(0 0 0 / .18)}
  .fab b{font-weight:500;opacity:.85;font-size:13px}
  body.has-tray .fab{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}

  <details class="method box" id="method">
    <summary>추천 점수는 이렇게 계산해요</summary>
    <div class="mgrid">
      <div><h4>1. 조건으로 거르기</h4><p>우유·콩 알레르기, 유당, 식물성 조건은 라벨로 확인한 값만 씁니다. 우유·대두 알레르기는 함유가 ‘없음’으로 확인된 제품만 남기고, ‘같은 시설’·‘모름’·미확인 제품은 뺍니다. 원료 선호는 원재료에서 단백질 원료만 찾아 ‘동물성’(유청·카제인·우유단백·산양유 등만), ‘식물성’(대두·완두·쌀 등만), ‘복합성’(둘을 섞음)으로 나눕니다(크리머 안 카제인나트륨, 1순위가 아닌 탈지분유·유청분말, 대두 레시틴은 세지 않음). ‘식물성’은 원재료에 우유가 없는 제품(우유를 쓰는 시설에서 만든 제품 포함)만 남기며, 같은 시설 제조까지 피하려면 우유 알레르기를 함께 고르면 됩니다. 유당 조건은 ‘조금 불편해요’면 원재료 1순위(주원료)가 WPI(분리유청, 가수분해 분리유청 포함)인 제품, ‘아주 불편해요’면 그중 WPI가 원재료의 99% 이상으로 확인된 제품을 남기고, 두 경우 모두 원재료에 우유가 없는 식물성 제품(같은 시설 제조 포함)도 남깁니다(우유 알레르기나 식물성을 고르면 이미 우유가 빠져 이 조건은 쓰지 않음). 1회분 예산(판매가 × 1회 제공량 ÷ 총 중량, 1회 제공량은 제조사 기준이라 한 스쿱과 다를 수 있음)에 맞지 않는 제품도 빼고, 1회분 가격을 계산할 수 없는 제품은 예산을 고르면 뺍니다. 전체 비교 조건 필터의 ‘인공감미료 없음’은 원재료 전체에 수크랄로스·아세설팜칼륨·아스파탐·사카린이 없는 제품(스테비아·에리스리톨·알룰로스는 인공감미료로 보지 않음), ‘저당·저지방’은 1회 당류 1g 이하이면서 1회 지방 2g 이하이고, 값이 확인되지 않은 제품은 빠집니다. 게이너는 벌크업에서만 추천하고, 다른 목적에서는 ‘전체 <span class="n-all">100</span>개 비교’에서만 보여줍니다. 근육 키우기·취침 전에서는 식사대용 제품도 뺍니다.</p></div>
      <div><h4>2. 여섯 가지 지표 비교</h4><p>단백질 함량, 20g당 가격, 맛, 품질 신뢰도, 인기도, 칼로리(같은 단백질 양에 칼로리가 적을수록 좋음, 벌크업은 1회 칼로리가 높을수록 좋음)를 <span class="n-all">100</span>개 안에서의 상대 위치(0~1)로 바꿉니다. 맛은 리뷰가 적을수록 평균 쪽으로 당겨서 리뷰 몇 개로 100%가 나온 제품이 과하게 앞서지 않게 합니다.</p></div>
      <div><h4>3. 목적별 가중치</h4><p>목적마다 여섯 지표의 중요도를 슬라이더로 조절할 수 있고, 아래 표의 비율로 합산합니다. 조정한 값은 이 브라우저에 저장됩니다. 벌크업은 칼로리 지표를 1회 칼로리가 높을수록 좋게 보고, 취침 전은 주원료가 카제인이면 가점(우유단백은 조금 작게)을 줍니다. 원하는 맛이면 가점, 다른 맛이면 감점, ‘제품명 과장’(라벨 경고) 1건마다 감점, 쿠팡 판매 페이지에 영양정보·원재료표가 없거나 라벨 경고를 판정하지 못한 제품은 0.5건만큼 감점, 라벨 표기 문제는 감점 없이 표시만, 아미노산·콜라겐이 원재료 1~5순위에 단독 원료로 있으면 경고 1건으로 감점(복합원료 안에 있거나 6순위 이후, 표기된 함량상 소량이면 감점 없이 ‘소량’으로만 표시), 출처 등급 C·D는 소폭 감점합니다. 1회 단백질이 15g 미만인 제품은 점수에 넣지 않고 ‘확인할 점’으로만 알려줍니다.</p>
        <div class="tblwrap"><table class="wt" id="wtable"></table></div></div>
      <div><h4>4. 상위 3개 고르기</h4><p>마지막에 그린 ‘원하는 능력치’ 육각형을 제품 능력치가 얼마나 채우는지(충족도, 축마다 원하는 값까지만 셈)를 구해 위 점수와 반반으로 합친 값이 최종 적합도예요. 그 순서대로 고르되, 같은 제조원 제품은 상위 3개에 하나만 넣고 나머지는 ‘다음 후보’로 내립니다. 엑셀 ‘제조원’ 열 기준이며, 제조원을 확인하지 못한 제품은 서로 묶지 않습니다. 다음 후보에는 적합도와 가장 큰 추천 이유를 한 줄로 붙입니다.</p></div>
      <div><h4>데이터 읽는 법</h4><p>단백질 함량은 질소량으로 계산하기 때문에, 따로 넣은 아미노산이나 콜라겐도 단백질로 잡혀요. 이런 원료가 들어간 제품은 실제 단백질이 표시보다 낮을 수 있어요. 총량의 ‘약 N회분’은 총 중량을 1회 제공량으로 나눈 값이고, 1회 제공량은 제조사가 정한 양이라 한 스쿱이 아닐 수 있어요. 품질 신뢰도는 공개 자료로 확인된 항목만 점수를 준 값이라, 낮은 점수가 품질이 나쁘다는 뜻은 아닙니다. 맛·알레르기·영양 정보는 라벨에서 확인한 값만 보여주고, 아직 확인하지 않은 제품은 ‘확인 안 됨’으로 표시합니다. 라벨 문제는 세 가지로 나눠요. ‘제품명 과장’은 제품명에 적힌 단백질(예: WPI, 아이솔레이트, 산양유)과 달리 다른 단백질이 섞이거나 앞 순위인 경우(제품명에 혼합·블렌드·복합·매트릭스를 밝혔거나, 이름이 ‘아이솔레이트’이고 섞인 단백질이 모두 분리 단백질이면 제외), ‘영양정보 미게시’는 쿠팡 판매 페이지에 정식 영양정보표나 원재료표가 없는 경우(다른 사이트 라벨로 보충한 제품 포함), ‘라벨 표기 문제’는 제품명의 숫자·단위·기준·홍보 문구가 라벨과 맞지 않는 경우예요. 주원료는 원재료 1순위이고, ‘주원료 99% 이상’은 원재료표에서 1순위 원료에 99% 이상이 적혀 있거나, 원료가 하나뿐이거나, 나머지 원료가 모두 % 표기되어 합이 1% 이하인 제품이에요(표기가 없으면 넣지 않음). 게이너·식사대용은 상품명(게이너는 단백질 30% 미만이면서 말토덱스트린 포함도)으로 나눕니다.</p></div>

const FLAVC = {'초코':'#6B4128','곡물·미숫가루':'#C9A06A','바닐라·밀크':'#EADBB8','커피':'#4A3424','말차·녹차':'#7FA35A','과일·디저트':'#EE8FA4','무맛':'#CFD3D8'};

const rateHTML = p => p.rating==null ? `<span class="rate">평점 없음 (${p.rev.toLocaleString('ko-KR')})</span>` : `<span class="rate"><span class="stars" style="--r:${p.rating/5*100}%" aria-label="평점 ${p.rating}">★★★★★</span>(${p.rev.toLocaleString('ko-KR')})</span>`;
const scoopTxt = p => `1스쿱 단백질 ${p.sp!=null?p.sp+'g':'확인 불가'}`;  /* 1스쿱 = 1회 제공량 */
const priceHTML = p => `<span class="price">${p.price==null?'가격 확인 불가':Math.round(p.price).toLocaleString('ko-KR')+'<small>원</small>'+(p.servings?`<span class="sv">${p.servings}회분${p.perServ!=null?`(회당 ${won(p.perServ)})`:''}</span>`:'')}</span><span class="unit"><span class="nw">${scoopTxt(p)}</span><wbr><span class="nw">(20g당 ${won(p.p20)})</span></span>`;

/* ---------- 아미노산·콜라겐 첨가 판정 (원재료 전체의 순서와 표기 %만 사용) ---------- */
function topItems(s){
  const out=[]; let depth=0, cur='';
  for(const ch of s){
    if('([{（［'.includes(ch)) depth++;
    if(')]}）］'.includes(ch)) depth=Math.max(0,depth-1);
    if((ch===','||ch==='，') && depth===0){ if(cur.trim()) out.push(cur.trim()); cur=''; } else cur+=ch;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
const AMINO_RX = /아미노산|아미노믹스|BCAA|EAA|이에이에이|비씨에이에이|L-?로이신|L-?류신|L-?이소류신|L-?발린|글루타민(?!산)|글리신|타우린|크레아틴|아르기닌|[Aa]mino [Aa]cid|[Gg]lycine|[Tt]aurine|[Ll]-?[Ll]eucine|[Gg]lutamine|[Cc]reatine|[Aa]rginine/;
const COLL_RX = /콜라겐|젤라틴|[Cc]ollagen|[Gg]elatin/;
const headOf = t => t.split(/[([{（［]/)[0].trim();

function findAdd(items, rx){
  const i = items.findIndex(t=>rx.test(t)); if(i<0) return null;
  const t = items[i], head = headOf(t), own = rx.test(head) && !/유청|대두|산양유|초유|우유|[Ww]hey|[Ss]oy/.test(head);  /* 단백질 복합원료 이름에 섞인 경우는 복합원료로 봄 */
  const before = items.slice(0,i).map(pctOf), sumBefore = before.every(v=>v!=null) && before.length ? before.reduce((a,b)=>a+b,0) : null;
  const ownPct = own ? pctOf(t) : null;
  let level = 'info', why = 'late';
  if(!own){ why = 'nested'; }
  else if(/less than 2%|2% 미만/i.test(items.slice(0,i+1).join(','))){ why = 'lt2'; }
  else if(ownPct!=null && ownPct<5){ why = 'pct'; }
  else if(sumBefore!=null && sumBefore>=95){ why = 'rest'; }
  else if(i+1<=5){ level = 'warn'; why = 'top5'; }
  return {pos:i+1, name:(own?head:headOf(t)).slice(0,24), level, why};
}
function additives(p){
  const src = p.ingFull || p.ing || ''; if(!src) return null;
  const items = topItems(src);
  return {amino: findAdd(items, AMINO_RX), collagen: findAdd(items, COLL_RX), full: !!p.ingFull};
}

/* ---------- 주원료 99% 이상 판정 (원재료 전체에 적힌 순서와 % 표기만 사용) ---------- */
function share99(p){
  if(!p.ingFull || p.unchk) return false;  /* 원재료표가 아닌 문구(판정 불가)는 제외 */
  const s = p.ingFull.replace(/[、／]/g, ',');
  let d = 0; for(const ch of s){ if('([{（［'.includes(ch)) d++; if(')]}）］'.includes(ch)) d--; if(d<0) return false; }
  if(d!==0) return false;  /* 괄호가 맞지 않으면 원재료 경계를 알 수 없음 */
  const items = topItems(s); if(!items.length) return false;
  let first = items[0], prev; do { prev = first; first = first.replace(/[([{（［][^()[\]{}（）［］]*[)\]}）］]/g, ' '); } while(first!==prev);
  const own = pctOf(first);
  if(own!=null && own>=99) return true;                                   /* 1순위 원료 자체에 99% 이상 표기 */
  if(items.length===1) return !/[,，]/.test(items[0]);                     /* 원료가 하나뿐 (괄호 안이 원산지 등일 때만) */
  const rest = items.slice(1).map(pctOf);
  return rest.every(v=>v!=null) && rest.reduce((a,b)=>a+b,0)<=1;           /* 나머지 원료가 모두 % 표기되고 합이 1% 이하 */
}
/* ---------- 단백질 원료 유형 (조사 명세 5-6): 원재료 전체에서 단백질 원료만 찾아 동물성·식물성·복합으로 나눔 ---------- */
const PT = [['WPH',/가수분해\s*(분리)?\s*유청|hydrolyz\w*\s+whey|\bWPH\b/i,'a'],['WPI',/분리\s*유청|\bWPI\b|whey\s+protein\s+isolate/i,'a'],['WPC',/농축\s*유청|\bWPC\b|whey\s+protein\s+concentrate|유청단백농축|ホエイたんぱく濃縮/i,'a'],
  ['MPI',/분리\s*우?유단백|\bMPI\b|milk\s+protein\s+isolate/i,'a'],['MPC',/농축\s*우유단백|\bMPC\b|milk\s+protein\s+concentrate/i,'a'],['카제인',/카[제세]인|casein|カゼイン/i,'a'],
  ['산양유단백',/산양유/,'a'],['난백',/난백|egg\s*white|卵白/i,'a'],['유청',/유청\s*단백|whey|ホエイ/i,'a'],['우유단백',/우유\s*단백|유단백|milk\s+protein|乳(蛋白|たんぱく|タンパク)/i,'a'],
  ['ISP',/대두\s*단백|\bISP\b|soy\s+protein|大豆(蛋白|たんぱく|タンパク)/i,'p'],['PPI',/완두\s*단백|\bPPI\b|pea\s+protein|えんどう(豆)?(蛋白|たんぱく|タンパク)/i,'p'],['쌀단백질',/쌀\s*단백|현미\s*단백|rice\s+protein/i,'p'],['밀단백',/밀\s*단백|wheat\s+protein/i,'p']];
const PT_FIRST = [['유청',/유청분말/,'a'],['우유단백',/탈지분유|전지분유/,'a']];  /* 1순위일 때만 셈 */
const NOT_PROT = /^(혼합)?(탈지분유|전지분유|유청분말)$|레시틴|lecithin/i;  /* 단백질 원료로 세지 않음 (1순위 제외) */
const BLEND_HEAD = /프로틴|단백|protein|블렌드|블랜드|컴플렉스|콤플렉스|매트릭스|blend|matrix|complex/i;
const ptOf = (t, first) => { const h = headOf(t).trim(); if(!first && NOT_PROT.test(h)) return null; return PT.find(([,rx])=>rx.test(t)) || (first && PT_FIRST.find(([,rx])=>rx.test(h))) || null; };
const toks = s => s.split(/[,，、()[\]{}（）［］]/).map(x=>x.trim()).filter(Boolean);
function protTypes(p){
  const raw = p.ingFull || p.ing || '';  /* 원재료 전체가 없으면 '단백질 종류'(원재료 앞 3개) */
  if(!raw || /^확인 불가/.test(raw)) return null;
  const src = raw.replace(/^\s*[([（［][^()（）[\]［］]*[)\]）］]\s*/, '');  /* 앞에 붙은 '(라벨 설명)' 메모는 뺌 */
  let d = 0; for(const ch of src){ if('([{（［'.includes(ch)) d++; if(')]}）］'.includes(ch)) d--; }
  const found = [];
  if(d!==0) toks(src).forEach((u,i)=>{ const x = ptOf(u, i===0); if(x) found.push(x); });  /* 괄호가 맞지 않으면 낱말 단위로 찾음 */
  else topItems(src).forEach((t,i)=>{
    const head = headOf(t), inner = t.slice(head.length);
    if(BLEND_HEAD.test(head) && !/크리머|creamer|크림/i.test(head) && toks(inner).some(u=>ptOf(u))){ toks(inner).forEach(u=>{ const x = ptOf(u); if(x) found.push(x); }); return; }  /* 단백질 블렌드는 괄호 안 단백 원료를 셈 */
    const x = ptOf(head, i===0);
    if(x){ const y = ptOf(t, i===0); found.push(y && y[2]===x[2] && ['유청','우유단백'].includes(x[0]) ? y : x); }  /* 괄호 안 유형 표기(WPC 등)가 있으면 그것을 씀 */
  });
  const names = [...new Set(found.map(x=>x[0]))], kinds = new Set(found.map(x=>x[2]));
  if(!names.length) return null;
  const uniq = [...new Map(found.map(x=>[x[0],x])).values()], share = {a: uniq.filter(x=>x[2]==='a').length/uniq.length, p: uniq.filter(x=>x[2]==='p').length/uniq.length};  /* 단백 원료 종류 수 기준 비율 */
  return {names, kind: kinds.size>1 ? '복합' : kinds.has('p') ? '식물성' : '동물성', first: found[0][2], share};
}
/* 유당 조건: 조금 불편 = 원재료 1순위(주원료)가 WPI, 아주 불편 = 주원료 WPI이면서 원재료의 99% 이상. 우유 알레르기·식물성 선택 시엔 이미 우유가 없어 쓰지 않음 */
const BLEND_RX = /혼합|블렌드|블랜드|복합|매트릭스|[Bb]lend|[Mm]atrix/;  /* '믹스'(드링크 믹스)·'웨이'(유청)는 혼합 표시가 아님 */
/* 추가 조건 (시트 값에 대한 고정 규칙). 값을 확인할 수 없으면 조건을 통과하지 않음 */

const skipQ = i => Q[i] && Q[i].id==='lac' && A.alg.includes('milk');

/* ---------- 원하는 능력치 (육각형 커스텀): 0~5. 제품 능력치가 이 모양을 얼마나 채우는지(충족도)를 점수와 반반 합쳐 최종 순위 ---------- */

/* ---------- scoring ---------- */
function weights(){ return share(A.goal); }
function eligible(p){
  if(p.cat==='게이너' && A.goal!=='bulk') return false;  /* 게이너는 벌크업에서만 추천 */
  if(A.alg.includes('milk') && p.milk!=='없음') return false;
  if(A.alg.includes('soy') && p.soy!=='없음') return false;
  if((A.goal==='muscle' || A.goal==='night') && p.cat==='식사대용') return false;
  if(lacOn() && !lacOK(p, A.lac)) return false;
  if(A.src==='animal' && ptKind(p)!=='동물성') return false;
  if(A.src==='plant' && !isPlant(p)) return false;  /* 식물성 = 단백질 원료가 모두 식물성 + 원재료에 우유 없음 (같은 시설 여부는 우유 알레르기 질문에서 거름) */
  if(A.src==='mix' && ptKind(p)!=='복합') return false;
  const bud = +A.bud; if(bud && !(p.perServ!=null && p.perServ<=bud)) return false;  /* 1회분 가격 = 판매가 × 1회 제공량 ÷ 총 중량, 계산할 수 없으면 제외 */
  if(A.ext.includes('cert') && !p.cert3) return false;
  if(A.ext.includes('nowarn') && (p.mix || p.unchk || p.addWarn.length)) return false;
  if(A.ext.includes('single') && p.bundle) return false;
  for(const k of A.ext) if(EXTF[k] && !EXTF[k](p)) return false;
  return true;
}
const mv = (p,k) => k==='kcal' && A.goal==='bulk' ? p.m.kcalHi : p.m[k];  /* 벌크업은 칼로리 지표 방향을 반대로 */
const NIGHT = {'카제인':.25,'우유단백':.15};
function score(p, w){
  let s = 0; const parts = {};
  for(const k in w){ const m = mv(p,k), v = m==null ? 0.3 : m; parts[k] = v*w[k]; s += parts[k]; }
  let adj = 0;
  if(A.flav!=='any'){
    const strong = A.flav==='무맛';
    if(p.flav.includes(A.flav)) adj += strong?.12:.08;
    else if(p.flav.length) adj -= strong?.15:.08;  /* 맛 미확인은 가감 없음 */
  }
  adj -= (p.mix ? p.wn : 0)*.04;
  adj -= p.addWarn.length*.04;  /* 아미노산·콜라겐이 원재료 1~5순위에 단독 원료로 있으면 경고 1건으로 봄 */
  if(p.unchk || p.nopost) adj -= .02;  /* 판매 페이지에 영양정보·원재료표가 없거나 라벨 경고를 판정하지 못함 (라벨 표기 문제는 감점 없음) */
  if(p.grade==='D') adj -= .06; else if(p.grade==='C') adj -= .02;
  if(A.goal==='night') adj += NIGHT[p.src]||0;  /* 취침 전: 천천히 흡수되는 카제인 주원료 가점 (우유단백은 카제인이 대부분이라 조금 작게) */

function topPct(v){ return Math.max(1, Math.round((1-v)*100)); }
function reasons(p, parts){
  const out = [];
  const keys = Object.keys(parts).sort((a,b)=>parts[b]-parts[a]);
  for(const k of keys){
    const v = mv(p,k); if(v==null || v<0.6 || !parts[k]) continue;  /* 가중치 0인 지표는 이유로 쓰지 않음 */
    if(k==='dens') out.push(`단백질 함량 ${pctS(p.pct)}, ${P.length}개 중 상위 ${topPct(v)}%`);
    if(k==='value') out.push(`단백질 20g당 ${won(p.p20)}, 상위 ${topPct(v)}% 가성비`);
    if(k==='taste') out.push(`맛있어요 ${pctS(p.taste)} (리뷰 ${p.rev.toLocaleString('ko-KR')}개)`);
    if(k==='trust') out.push(p.cert3 ? `${p.cert} 인증, 품질 신뢰도 ${p.q}점` : `품질 신뢰도 ${p.q}점, 공개 자료가 많은 편`);
    if(k==='pop') out.push(`쿠팡 랭킹 ${p.r}위, 리뷰 ${p.rev.toLocaleString('ko-KR')}개`);
    if(k==='kcal' && A.goal==='bulk') out.push(`1회 ${p.kcal}kcal로 칼로리가 높은 편, 상위 ${topPct(v)}%`);
    else if(k==='kcal') out.push(`1회 ${p.kcal}kcal, 칼로리 대비 단백질이 많은 편 (상위 ${topPct(v)}%)`);
  }
  if(A.flav!=='any' && p.flav.includes(A.flav)) out.unshift(`원하는 ${A.flav} 맛`);
  if(A.goal==='night' && NIGHT[p.src]) out.unshift(p.src==='카제인' ? '천천히 흡수되는 카제인이 주원료' : '카제인이 많은 우유단백이 주원료');

function cautions(p){

  if(p.mix) c.push('제품명 과장: '+p.warn);
  if(p.nopost) c.push('영양정보 미게시: '+p.nopost);

  if(p.taste==null) c.push('맛 설문 없음');
  else if(p.rev<100 && p.taste>=.95) c.push(`리뷰 ${p.rev}개라 맛 평가 표본이 적음`);
  if(A.flav!=='any' && !p.flav.length) c.push(p.flavText==='표기 없음' ? '맛 표기 없는 제품' : '맛 확인 안 됨, 상세페이지에서 맛 확인');
  if(A.src==='plant' && p.milk==='같은 시설') c.push('우유를 쓰는 시설에서 제조');
  if(p.bundle) c.push('단품이 없어 묶음 옵션 가격');

/* 원료 라벨: 단백질 원료가 한 종류면 동물성·식물성, 여러 종류면 동물성복합·식물성복합, 둘이 섞이면 동식물성복합 */
const ptLabel = p => !p.ptype ? null : p.ptype.kind==='복합' ? '동식물성복합' : p.ptype.kind + (p.ptype.names.length>1 ? '복합' : '');
function tagsHTML(p){
  const pl = ptLabel(p), t = [];
  if(pl) t.push(`<span class="tag" title="단백질 원료: ${esc(p.ptype.names.join(', '))}">${pl}</span>`);
  t.push(`<span class="tag" title="원재료에서 처음 나오는 단백질 원료 기준">주원료 ${esc(p.srcG)}</span>`);
  if(p.cat!=='단백질 보충제') t.push(`<span class="tag">${p.cat}</span>`);
  if(p.cert3) t.push(`<span class="tag good">${esc(p.cert)}</span>`);
  else if(p.cert==='HACCP') t.push(`<span class="tag">HACCP</span>`);
  if(p.lacfree==='있음') t.push(`<span class="tag good">락토프리 표기</span>`);

/* 주원료 필터 (2026-11-03): 원재료에서 처음 나오는 단백질 원료 기준. 복합 = 동물성+식물성(유청·MPC가 먼저면 복합(그 원료), 대두가 먼저면 복합(대두), 그 밖의 동물성이 먼저면 그 원료 칸) */
const SRC_ORDER = ['복합(대두)','복합(WPC)','복합(WPI)','복합(MPC)','유청(WPI)','유청(WPC)','우유단백','카제인','산양유','대두','완두·현미 등','기타'];
const SRC_A = {WPI:'유청(WPI)',WPH:'유청(WPI)',WPC:'유청(WPC)','유청':'유청(WPC)',MPC:'우유단백',MPI:'우유단백','우유단백':'우유단백','카제인':'카제인','산양유단백':'산양유'};
const SRC_MIX = {WPI:'WPI',WPH:'WPI',WPC:'WPC','유청':'WPC',MPC:'MPC'};
function srcGroup(p){
  if(!p.ptype) return SRC_ORDER.includes(p.src) ? p.src : '기타';
  const f = p.ptype.names[0];
  if(p.ptype.kind==='복합'){
    if(f==='ISP') return '복합(대두)';
    if(SRC_MIX[f]) return `복합(${SRC_MIX[f]})`;
    return SRC_A[f] || '기타';
  }
  if(p.ptype.kind==='식물성') return f==='ISP' ? '대두' : '완두·현미 등';
  return SRC_A[f] || '기타';
}
P.forEach(p=>{ p.srcG = srcGroup(p); });
const srcF = p => p.srcG;
const SRCS = [['all','전체']].concat(SRC_ORDER.filter(s=>P.some(p=>p.srcG===s)).map(s=>[s,s]));
const FLAGS = [['nomilk','우유 없음 확인'],['nosoy','대두 없음 확인'],['lacfree','락토프리 표기'],['cert','제3자 인증'],['noadd','첨가 경고 없음'],['main99','주원료 99% 이상'],['nosweet','인공감미료 없음'],['lowsugar','저당·저지방 (당류 1g·지방 2g 이하)']];
function chipGroup(id, list, cur, multi){
  const g = $(id); const lab = g.querySelector('span').outerHTML;
  g.innerHTML = lab + list.map(([v,l])=>`<button class="chip" type="button" id="f-${id.slice(3)}-${esc(v)}" data-v="${esc(v)}" aria-pressed="${multi?cur.includes(v):cur===v}">${esc(l)}</button>`).join('');
}
function renderCatalog(){
  chipGroup('#f-cat', CATS, F.cat); chipGroup('#f-src', SRCS, F.src); chipGroup('#f-flag', FLAGS, F.flags, true);
  const q = F.q.trim().toLowerCase();
  let rows = P.filter(p=>(F.cat==='all'||p.cat===F.cat)&&(F.src==='all'||srcF(p)===F.src)
    &&(!F.flags.includes('nomilk')||p.milk==='없음')&&(!F.flags.includes('nosoy')||p.soy==='없음')&&(!F.flags.includes('lacfree')||p.lacfree==='있음')&&(!F.flags.includes('cert')||p.cert3)&&(!F.flags.includes('noadd')||!p.addWarn.length)&&F.flags.every(k=>!EXTF[k]||EXTF[k](p))
    &&(!q||[p.n,p.ing,p.mk,p.ingFull,p.flavText].join(' ').toLowerCase().includes(q)));
  const s = F.sort, nullLast = (a,b,f)=> (a==null)-(b==null) || f();
  const cmp = {r:(a,b)=>a.r-b.r, p20:(a,b)=>nullLast(a.p20,b.p20,()=>a.p20-b.p20), pct:(a,b)=>nullLast(a.pct,b.pct,()=>b.pct-a.pct),
    taste:(a,b)=>nullLast(a.tb,b.tb,()=>b.tb-a.tb), q:(a,b)=>b.q-a.q||a.r-b.r, price:(a,b)=>a.price-b.price, scoop:(a,b)=>nullLast(a.perServ,b.perServ,()=>a.perServ-b.perServ)}[s];
  rows.sort(cmp);
  $('#cat-count').textContent = `${rows.length}개 제품` + (s==='taste'?' · 맛은 리뷰 수를 반영한 보정값 순':'');
  $('#catalog').innerHTML = rows.length ? rows.map(p=>itemRow(p, p.r)).join('') : `<div class="empty">조건에 맞는 제품이 없어요. 필터를 하나 풀어보세요.</div>`;
}
$('#view-all').addEventListener('click', e=>{

  const g = b.parentElement.id, v = b.dataset.v;
  if(g==='f-cat') F.cat=v; else if(g==='f-src') F.src=v; else F.flags = F.flags.includes(v)?F.flags.filter(x=>x!==v):F.flags.concat(v);

});

/* ---------- compare (최대 3개, 이 브라우저에만 기억) ---------- */
let CMP = [];
try{ const s = JSON.parse(localStorage.getItem('ppick-cmp')||'[]'); if(Array.isArray(s)) CMP = s.filter(n=>P.some(p=>p.n===n)).slice(0,3); }catch(e){}
const inCmp = p => CMP.includes(p.n);
function cmpBtn(p, cls){ const on = inCmp(p); return `<button class="${cls}" type="button" data-cmp="${p.r}" aria-pressed="${on}" aria-label="${esc(p.short)} 비교${on?'에서 빼기':'에 담기'}">${on?'✓ 비교 중':'＋ 비교'}</button>`; }
function saveCmp(){ try{ localStorage.setItem('ppick-cmp', JSON.stringify(CMP)); }catch(e){} }
function refreshCmp(msg){
  document.querySelectorAll('[data-cmp]:not(.tray-x):not(.cmp-keep)').forEach(b=>{ const p = P.find(x=>x.r===+b.dataset.cmp); if(!p) return; const on = inCmp(p);
    b.setAttribute('aria-pressed', on); b.textContent = on ? '✓ 비교 중' : '＋ 비교'; b.setAttribute('aria-label', `${p.short} 비교${on?'에서 빼기':'에 담기'}`); });
  const tray = $('#tray'); tray.hidden = CMP.length===0; document.body.classList.toggle('has-tray', CMP.length>0);
  $('#tray-k').textContent = `비교함 ${CMP.length}/3`;
  $('#tray-items').innerHTML = CMP.map(n=>{ const p = P.find(x=>x.n===n); return `<span class="tray-it"><span>${esc(p.short)}</span><button type="button" data-cmp="${p.r}" class="tray-x" aria-label="${esc(p.short)} 비교에서 빼기">×</button></span>`; }).join('');
  $('#tray-go').disabled = CMP.length<2; $('#tray-go').textContent = CMP.length<2 ? '하나 더 담아 주세요' : '비교하기';
  $('#tray-msg').textContent = msg || '';
  if($('#cmp').open){ if(CMP.length) renderCmp(); else $('#cmp').close(); }
}
function toggleCmp(r){
  const p = P.find(x=>x.r===+r); if(!p) return;
  if(inCmp(p)) CMP = CMP.filter(n=>n!==p.n);
  else if(CMP.length>=3) return refreshCmp('3개까지 비교할 수 있어요. 하나를 빼고 담아 주세요.');
  else CMP = CMP.concat(p.n);
  saveCmp(); refreshCmp();
}
function renderCmp(){
  const ps = CMP.map(n=>P.find(x=>x.n===n));
  const w = weights();
  const fit = p => eligible(p) ? Math.round(score(p,w).s*100) : null;
  const best = (get, low) => { const v = ps.map(get).filter(x=>x!=null); if(v.length<2) return null; return low ? Math.min(...v) : Math.max(...v); };
  const rows = [
    ['지금 조건 적합도', p=>fit(p), v=>v==null?'<span class="rk na">조건 밖</span>':v, false],
    ['판매가', p=>p.price, won, true],
    ['회당 가격', p=>p.perServ, (v,p)=>v==null?val(null):`${won(v)} <span class="rk">${p.ss}g · 단백질 ${p.sp??'—'}g</span>`, true],
    ['총량', p=>null, (v,p)=>esc(sizeTxt(p)), null],
    ['단백질 20g당', p=>p.p20, won, true],
    ['단백질 함량', p=>p.pct, pctS, false],
    ['1회 단백질', p=>p.sp, (v,p)=>v==null?val(null):`${v}g / ${p.ss??'—'}g`, null],
    ['맛있어요', p=>p.tb, (v,p)=>p.taste==null?'설문 없음':`${pctS(p.taste)} <span class="rk">리뷰 ${p.rev.toLocaleString('ko-KR')}</span>`, false],
    ['평점', p=>p.rating, v=>v==null?'—':v, null],
    ['품질 신뢰도', p=>p.q, v=>`${v}<span class="rk">/100</span>`, false],
    ['제3자 인증', p=>null, (v,p)=>p.cert3?`<span class="tag good">${esc(p.cert)}</span>`:esc(p.cert||'—'), null],
    ['제품명 과장', p=>null, (v,p)=>p.mix?`<span class="warn-t">있음</span> <span class="rk na">${esc(p.warn)}</span>`:p.unchk?'<span class="rk na">판정 못 함</span>':'없음', null],
    ['영양정보 게시', p=>null, (v,p)=>p.nopost?`<span class="warn-t">미게시</span> <span class="rk na">${esc(p.nopost)}</span>`:'게시', null],
    ['라벨 표기 문제', p=>null, (v,p)=>p.lblx?`<span class="rk na">${esc(p.lblx)}</span>`:'없음', null],
    ['아미노산·콜라겐', p=>null, (v,p)=>p.addWarn.length?`<span class="warn-t">${p.addWarn.map(k=>ADDN[k]).join('·')} 첨가</span>`:p.addInfo.length?`<span class="rk na">${p.addInfo.map(k=>ADDN[k]).join('·')} 소량</span>`:'없음', null],
    ['주원료', p=>null, (v,p)=>esc(p.srcG), null],
    ['맛', p=>null, (v,p)=>val(p.flavText), null],
    ['우유 함유', p=>null, (v,p)=>val(p.milk), null],
    ['대두 함유', p=>null, (v,p)=>val(p.soy), null],
    ['1회 칼로리', p=>null, (v,p)=>p.kcal!=null?`${p.kcal}kcal`:val(null), null],
    ['출처 등급', p=>null, (v,p)=>esc(GRADE[p.grade]||p.grade), null],
  ];
  const lead = new Map();
  const nm = p => p.short.length>18 ? p.short.slice(0,18)+'…' : p.short;
  const bp = (get, low) => { const b = best(get, low); if(b==null) return null; const hit = ps.filter(p=>get(p)===b); return hit.length===1 ? hit[0] : null; };
  const a = bp(p=>p.p20, true), b = bp(p=>p.pct, false), c = bp(p=>p.tb, false), d = bp(p=>p.q, false);
  [[a,'20g당 가격'],[b,'단백질 함량'],[c,'맛 평가'],[d,'품질 신뢰도']].forEach(([p,l])=>{ if(p) lead.set(p, (lead.get(p)||[]).concat(l)); });
  const leadTxt = [...lead].map(([p,ls])=>`${nm(p)}(${ls.join('·')})`).join(', ');
  $('#cmp-sheet').innerHTML = `<button class="close" type="button" id="c-close" aria-label="닫기">×</button>
    <h2 id="cmp-title">제품 ${ps.length}개 비교</h2>
    <p class="sub">${leadTxt ? '항목별로 가장 좋은 제품: ' + esc(leadTxt) + '. 초록 칸이 항목별 가장 좋은 값이고, 맛 평가는 리뷰 수를 반영한 값으로 비교했어요.' : '비교할 값이 충분하지 않아요.'}</p>
    ${ps.length>2?'<p class="cmp-hint">표를 옆으로 밀면 다른 제품도 볼 수 있어요 →</p>':''}
    <div class="cmp-wrap"><table class="cmp-t">
      <thead><tr><th scope="col"><span class="sr">항목</span></th>${ps.map(p=>`<th scope="col"><button type="button" class="cmp-nm" data-detail="${p.r}">${esc(p.short)}</button><span class="rk na">${esc(p.mk)} · 쿠팡 ${p.r}위</span></th>`).join('')}</tr></thead>
      <tbody>${rows.map(([label,get,fmt,low])=>{ const bv = low==null ? null : best(get, low);
        return `<tr><th scope="row">${label}</th>${ps.map(p=>{ const v = get(p); const isB = bv!=null && v===bv; return `<td${isB?' class="best"':''}>${fmt(v,p)}${isB?' <span class="bmark">가장 좋음</span>':''}</td>`; }).join('')}</tr>`; }).join('')}</tbody>
      <tfoot><tr><th scope="row"></th>${ps.map(p=>`<td><div class="cmp-acts">${buyUrl(p)?`<a class="btn pri" href="${esc(buyUrl(p))}" target="_blank" rel="${buyRel(p)}">쿠팡에서 보기</a>`:''}<button class="btn cmp-keep" type="button" data-cmp="${p.r}">빼기</button></div></td>`).join('')}</tr></tfoot>
    </table></div>`;
}
$('#tray-go').addEventListener('click', ()=>{ if(CMP.length<2) return; renderCmp(); const d = $('#cmp'); if(!d.open) d.showModal(); });
$('#tray-clear').addEventListener('click', ()=>{ CMP = []; saveCmp(); refreshCmp(); });

}

/* 육각형 꼭짓점 끌기: 누른 곳에서 가까운 축을 골라, 축 방향 거리로 0~5 */
let HXDRAG = null;
function hxFromEvent(e, axis){
  const svg = document.getElementById('hexc-svg'); if(!svg) return null;
  const m = svg.getScreenCTM(); if(!m) return null;
  const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()), dx = q.x-HX.cx, dy = q.y-HX.cy;
  if(axis==null){ const a = Math.atan2(dy, dx); let best = 0, bd = 9; for(let i=0;i<HK.length;i++){ let d = Math.abs(((a - hxAng(i, HK.length)) + 3*Math.PI) % (2*Math.PI) - Math.PI); if(d<bd){ bd = d; best = i; } } axis = best; }
  const proj = dx*Math.cos(hxAng(axis, HK.length)) + dy*Math.sin(hxAng(axis, HK.length));
  return {axis, v: Math.max(0, Math.min(5, Math.round(proj/HX.R*5)))};
}
$('#quiz').addEventListener('pointerdown', e=>{
  if(!e.target.closest('#hexc-svg')) return;
  const r = hxFromEvent(e); if(!r) return; HXDRAG = r.axis; e.preventDefault();
  if(curHW()[HK[r.axis]]!==r.v) setHex(HK[r.axis], r.v);
});
addEventListener('pointermove', e=>{ if(HXDRAG==null) return; const r = hxFromEvent(e, HXDRAG); if(r && curHW()[HK[r.axis]]!==r.v) setHex(HK[r.axis], r.v); });
addEventListener('pointerup', ()=>{ HXDRAG = null; });
addEventListener('pointercancel', ()=>{ HXDRAG = null; });

update(); renderCatalog(); refreshCmp();
})();
</script>
